<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accedi · Sala giochi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <form id="login" class="login">
    <h1>Sala giochi</h1>
    <p>Accedi per giocare e ritrovare i tuoi salvataggi.</p>
    <input id="username" placeholder="Nome utente" autocomplete="username" required autofocus>
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
    <button class="btn primary">Accedi</button>
    <small id="err" class="err" hidden></small>
  </form>
  <script src="js/login.js"></script>
</body>
</html>
